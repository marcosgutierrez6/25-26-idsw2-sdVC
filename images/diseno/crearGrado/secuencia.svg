<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <text x="20" y="30" font-family="sans-serif" font-size="14">Diagrama de secuencia - Crear Grado</text>
  <text x="20" y="50" font-family="sans-serif" font-size="12">Generar con: PlantUML server o kroki.io</text>
  <rect x="50" y="80" width="100" height="30" fill="#DDDDDD" stroke="#000000"/>
  <text x="60" y="100" font-family="sans-serif" font-size="12">Usuario (Docente)</text>
  <rect x="200" y="80" width="120" height="30" fill="#DDDDDD" stroke="#000000"/>
  <text x="210" y="100" font-family="sans-serif" font-size="12">GradosView</text>
  <rect x="380" y="80" width="130" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="390" y="100" font-family="sans-serif" font-size="12">GradosController</text>
  <rect x="570" y="80" width="120" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="580" y="100" font-family="sans-serif" font-size="12">GradosService</text>
  <rect x="50" y="340" width="100" height="30" fill="#E6E6E6" stroke="#000000"/>
  <text x="60" y="360" font-family="sans-serif" font-size="12">Base de Datos</text>
  <line x1="100" y1="110" x2="260" y2="110" stroke="#000000"/>
  <line x1="260" y1="110" x2="380" y2="110" stroke="#000000"/>
  <line x1="380" y1="110" x2="445" y2="110" stroke="#000000"/>
  <line x1="445" y1="110" x2="570" y2="110" stroke="#000000"/>
  <line x1="570" y1="110" x2="630" y2="110" stroke="#000000"/>
  <line x1="630" y1="110" x2="630" y2="340" stroke="#000000"/>
  <line x1="630" y1="340" x2="100" y2="340" stroke="#000000"/>
  <line x1="100" y1="340" x2="100" y2="180" stroke="#000000"/>
  <text x="640" y="200" font-family="sans-serif" font-size="10">Nuevo Grado</text>
  <text x="640" y="215" font-family="sans-serif" font-size="10">POST /grados</text>
  <text x="640" y="230" font-family="sans-serif" font-size="10">create()</text>
  <text x="640" y="245" font-family="sans-serif" font-size="10">INSERT Grado</text>
  <text x="640" y="260" font-family="sans-serif" font-size="10">Return created</text>
</svg>
