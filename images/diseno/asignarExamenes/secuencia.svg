<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <text x="20" y="30" font-family="sans-serif" font-size="14">Diagrama de secuencia - Asignar Exámenes</text>
  <text x="20" y="50" font-family="sans-serif" font-size="12">Generar con: PlantUML server o kroki.io</text>
  <rect x="50" y="80" width="100" height="30" fill="#DDDDDD" stroke="#000000"/>
  <text x="60" y="100" font-family="sans-serif" font-size="12">Usuario (Docente)</text>
  <rect x="200" y="80" width="120" height="30" fill="#DDDDDD" stroke="#000000"/>
  <text x="210" y="100" font-family="sans-serif" font-size="12">ExamenesView</text>
  <rect x="380" y="80" width="130" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="390" y="100" font-family="sans-serif" font-size="12">ExamenesController</text>
  <rect x="570" y="80" width="120" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="580" y="100" font-family="sans-serif" font-size="12">ExamenesService</text>
  <rect x="50" y="380" width="100" height="30" fill="#E6E6E6" stroke="#000000"/>
  <text x="60" y="400" font-family="sans-serif" font-size="12">Base de Datos</text>
  <line x1="100" y1="110" x2="260" y2="110" stroke="#000000"/>
  <line x1="260" y1="110" x2="380" y2="110" stroke="#000000"/>
  <line x1="380" y1="110" x2="445" y2="110" stroke="#000000"/>
  <line x1="445" y1="110" x2="570" y2="110" stroke="#000000"/>
  <line x1="570" y1="110" x2="630" y2="110" stroke="#000000"/>
  <line x1="630" y1="110" x2="630" y2="380" stroke="#000000"/>
  <line x1="630" y1="380" x2="100" y2="380" stroke="#000000"/>
  <line x1="100" y1="380" x2="100" y2="180" stroke="#000000"/>
  <text x="640" y="200" font-family="sans-serif" font-size="10">POST /examenes/asignar</text>
  <text x="640" y="215" font-family="sans-serif" font-size="10">asignar()</text>
  <text x="640" y="230" font-family="sans-serif" font-size="10">findUnique + include</text>
  <text x="640" y="245" font-family="sans-serif" font-size="10">ordenRespuestas</text>
  <text x="640" y="260" font-family="sans-serif" font-size="10">Loop: hash SHA-256</text>
  <text x="640" y="275" font-family="sans-serif" font-size="10">create AlumnoExamen</text>
  <text x="640" y="290" font-family="sans-serif" font-size="10">update Examen</text>
  <text x="640" y="305" font-family="sans-serif" font-size="10">Return result</text>
</svg>
