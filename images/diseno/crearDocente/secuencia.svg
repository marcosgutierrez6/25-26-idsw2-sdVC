<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <text x="20" y="30" font-family="sans-serif" font-size="14">Diagrama de secuencia - Crear Docente</text>
  <text x="20" y="50" font-family="sans-serif" font-size="12">Generar con: PlantUML server o kroki.io</text>
  <rect x="50" y="80" width="120" height="30" fill="#DDDDDD" stroke="#000000"/>
  <text x="55" y="100" font-family="sans-serif" font-size="12">Admin institucional</text>
  <rect x="210" y="80" width="120" height="30" fill="#DDDDDD" stroke="#000000"/>
  <text x="220" y="100" font-family="sans-serif" font-size="12">ProfesoresView</text>
  <rect x="380" y="80" width="130" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="390" y="100" font-family="sans-serif" font-size="12">ProfesoresController</text>
  <rect x="560" y="80" width="120" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="570" y="100" font-family="sans-serif" font-size="12">ProfesoresService</text>
  <rect x="50" y="380" width="100" height="30" fill="#E6E6E6" stroke="#000000"/>
  <text x="60" y="400" font-family="sans-serif" font-size="12">Base de Datos</text>
  <line x1="110" y1="110" x2="270" y2="110" stroke="#000000"/>
  <line x1="270" y1="110" x2="445" y2="110" stroke="#000000"/>
  <line x1="445" y1="110" x2="620" y2="110" stroke="#000000"/>
  <line x1="620" y1="110" x2="620" y2="380" stroke="#000000"/>
  <line x1="620" y1="380" x2="100" y2="380" stroke="#000000"/>
  <line x1="100" y1="380" x2="100" y2="180" stroke="#000000"/>
  <text x="630" y="200" font-family="sans-serif" font-size="10">Nuevo Docente</text>
  <text x="630" y="215" font-family="sans-serif" font-size="10">POST /profesores</text>
  <text x="630" y="230" font-family="sans-serif" font-size="10">create()</text>
  <text x="630" y="245" font-family="sans-serif" font-size="10">bcrypt.hash(pass,10)</text>
  <text x="630" y="260" font-family="sans-serif" font-size="10">INSERT Profesor</text>
  <text x="630" y="275" font-family="sans-serif" font-size="10">Return created</text>
