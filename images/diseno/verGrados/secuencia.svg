  <line x1="100" y1="110" x2="255" y2="110" stroke="#000000"/>
  <line x1="255" y1="110" x2="370" y2="110" stroke="#000000"/>
  <line x1="370" y1="110" x2="435" y2="110" stroke="#000000"/>
  <line x1="435" y1="110" x2="560" y2="110" stroke="#000000"/>
  <line x1="560" y1="110" x2="620" y2="110" stroke="#000000"/>
  <line x1="620" y1="110" x2="620" y2="320" stroke="#000000"/>
  <line x1="620" y1="320" x2="100" y2="320" stroke="#000000"/>
  <line x1="100" y1="320" x2="100" y2="180" stroke="#000000"/>
  <text x="630" y="200" font-family="sans-serif" font-size="10">Ver Grados</text>
  <text x="630" y="215" font-family="sans-serif" font-size="10">GET /grados</text>
  <text x="630" y="230" font-family="sans-serif" font-size="10">findAll()</text>
  <text x="630" y="245" font-family="sans-serif" font-size="10">SELECT</text>
