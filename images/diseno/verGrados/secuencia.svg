  <rect x="200" y="80" width="110" height="30" fill="#DDDDDD" stroke="#000000"/>
  <text x="210" y="100" font-family="sans-serif" font-size="12">GradosView</text>
  <rect x="370" y="80" width="130" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="380" y="100" font-family="sans-serif" font-size="12">GradosController</text>
  <rect x="560" y="80" width="120" height="30" fill="#FFF2CC" stroke="#000000"/>
  <text x="570" y="100" font-family="sans-serif" font-size="12">GradosService</text>
  <rect x="50" y="320" width="100" height="30" fill="#E6E6E6" stroke="#000000"/>
