<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <text x="20" y="30" font-family="sans-serif" font-size="14">Diagrama de secuencia - Ver Grados</text>
  <text x="20" y="50" font-family="sans-serif" font-size="12">Generar con: PlantUML server o kroki.io</text>
  <rect x="50" y="80" width="100" height="30" fill="#DDDDDD" stroke="#000000"/>
